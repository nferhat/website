[package]
name = "compiler"
version.workspace = true
edition.workspace = true

[dependencies]

# Configuration loading
serde.workspace = true
toml.workspace = true

# Highlighting powered by tree-sitter, the only correct highlighting engine.
tree-sitter-highlight = "0.26.8"
tree-sitter = "0.26.8"
# Needed to build the grammars, they are after all C.
cc = "1.2.60"
tempfile = "3.27.0"
# Loading compiled grammars from dynamic libraries
libloading = "0.8.3"

# Compiling styles
grass = "0.13.4"
rand = "0.10.1"

# Creating errors
thiserror.workspace = true
eyre = "0.6.12"

# Logging
tracing.workspace = true
codemap = "0.1.3"

# Use tokio and futures to make integration with the CLI much nicer.
# The server is based on axum, and it's async-first soo I'd rather not fight with
# that today.
tokio.workspace = true
futures.workspace = true

# Templating engine.
liquid = { version = "0.26.11", features = ["liquid-lib"] }

# Asset caching/handling.
blake3 = "1.8.5"

# Font parsing/caching
allsorts = "0.16.1"

# Compiling the djot -> html
jotdown = "0.10"
