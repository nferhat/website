[package]
name = "compiler"
version.workspace = true
edition.workspace = true

[dependencies]

# Configuration loading
serde.workspace = true
toml.workspace = true

# Compiling the markdown -> html
pulldown-cmark = { version = "0.13.3", features = ["simd"] }
pulldown-cmark-escape = { version = "0.11.0", features = ["simd"] }

# Compiling styles
grass = "0.13.4"

# Creating errors
thiserror.workspace = true
eyre = "0.6.12"

# Logging
tracing.workspace = true
codemap = "0.1.3"

# Use tokio and futures to make integration with the CLI much nicer.
# The server is based on axum, and it's async-first soo I'd rather not fight with
# that today.
tokio.workspace = true
futures.workspace = true

# Templating engine.
liquid = { version = "0.26.11", features = ["liquid-lib"] }
